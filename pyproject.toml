[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai6103-assignment"
version = "0.1.0"
description = "Reproducible EfficientNetV2-S hyperparameter experiments"
requires-python = ">=3.10"

[project.scripts]
ai6103 = "ai6103.cli:main"

[tool.setuptools.packages.find]
include = ["ai6103*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
